<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 296" width="100%" role="img" aria-labelledby="ti de"><title id="ti">Percolation transitions in semantic space</title><desc id="de">A single merge threshold chains four cards into one cluster; the stepwise flow separates them at measured crossing boundaries.</desc><rect width="720" height="296" fill="#ffffff"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5a5a5a"/></marker></defs><text x="14" y="20" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="start">a</text><text x="30" y="20" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#5a5a5a" font-weight="400" text-anchor="start">One threshold for the whole inventory</text><line x1="46" y1="86" x2="92" y2="52" stroke="#5a5a5a" stroke-width="1.1"/><text x="75.53830167192186" y="80.84593755612958" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#8a8a8a" font-weight="400" text-anchor="middle">0.84</text><line x1="92" y1="52" x2="126" y2="92" stroke="#5a5a5a" stroke-width="1.1"/><text x="100.61866750464594" y="82.12413262105095" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#8a8a8a" font-weight="400" text-anchor="middle">0.79</text><line x1="126" y1="92" x2="82" y2="122" stroke="#5a5a5a" stroke-width="1.1"/><text x="97.80329492894339" y="100.91149922911697" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#8a8a8a" font-weight="400" text-anchor="middle">0.85</text><line x1="46" y1="86" x2="82" y2="122" stroke="#5a5a5a" stroke-width="1.1"/><text x="56.22182540694798" y="114.77817459305203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#8a8a8a" font-weight="400" text-anchor="middle">0.50</text><circle cx="46" cy="86" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="46" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">a</text><circle cx="92" cy="52" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="92" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">b</text><circle cx="126" cy="92" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="126" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">c</text><circle cx="82" cy="122" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="82" y="126" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">d</text><text x="46" y="146" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#8a8a8a" font-weight="400" text-anchor="start">pairwise similarity</text><line x1="158" y1="86" x2="208" y2="86" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#ah)"/><text x="183" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">&#964; = 0.70</text><ellipse cx="300" cy="86" rx="70" ry="48" fill="#f7ece5" fill-opacity="0.5" stroke="#b4551f" stroke-width="1.1" stroke-dasharray="5 3"/><line x1="258" y1="86" x2="304" y2="52" stroke="#5a5a5a" stroke-width="1.1"/><line x1="304" y1="52" x2="338" y2="92" stroke="#5a5a5a" stroke-width="1.1"/><line x1="338" y1="92" x2="294" y2="122" stroke="#5a5a5a" stroke-width="1.1"/><line x1="258" y1="86" x2="294" y2="122" stroke="#5a5a5a" stroke-width="1.1"/><circle cx="258" cy="86" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="258" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">a</text><circle cx="304" cy="52" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="304" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">b</text><circle cx="338" cy="92" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="338" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">c</text><circle cx="294" cy="122" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="294" y="126" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">d</text><text x="300" y="150" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#b4551f" font-weight="600" text-anchor="middle">one cluster</text><text x="392" y="74" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5a5a5a" font-weight="400" text-anchor="start">Similarity chaining: a and d merge</text><text x="392" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5a5a5a" font-weight="400" text-anchor="start">through b and c even though their own</text><text x="392" y="102" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5a5a5a" font-weight="400" text-anchor="start">similarity is only 0.50.</text><text x="392" y="120" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#b4551f" font-weight="600" text-anchor="start">Granularity becomes an arbitrary choice.</text><line x1="14" y1="166" x2="706" y2="166" stroke="#d8d8d8" stroke-width="1"/><text x="14" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="start">b</text><text x="30" y="188" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="11" fill="#5a5a5a" font-weight="400" text-anchor="start">Stepwise flow at measured crossing boundaries</text><ellipse cx="69.0" cy="221.0" rx="36" ry="20" fill="#e4f0ec" fill-opacity="0.5" stroke="#1d6f5c" stroke-width="1.1" stroke-dasharray="5 3" transform="rotate(-36.5 69.0 221.0)"/><ellipse cx="104.0" cy="259.0" rx="36" ry="20" fill="#e4f0ec" fill-opacity="0.5" stroke="#1d6f5c" stroke-width="1.1" stroke-dasharray="5 3" transform="rotate(145.7 104.0 259.0)"/><line x1="46" y1="238" x2="92" y2="204" stroke="#5a5a5a" stroke-width="1.1"/><line x1="126" y1="244" x2="82" y2="274" stroke="#5a5a5a" stroke-width="1.1"/><line x1="46" y1="238" x2="82" y2="274" stroke="#d8d8d8" stroke-width="1" stroke-dasharray="3 3"/><circle cx="46" cy="238" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="46" y="242" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">a</text><circle cx="92" cy="204" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="92" y="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">b</text><circle cx="126" cy="244" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="126" y="248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">c</text><circle cx="82" cy="274" r="11" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="82" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">d</text><text x="86" y="292" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#1d6f5c" font-weight="600" text-anchor="middle">&#964;*&#8321; = 0.8333</text><line x1="150" y1="240" x2="196" y2="240" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#ah)"/><text x="173" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#8a8a8a" font-weight="400" text-anchor="middle">contract</text><circle cx="232" cy="240" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="232" y="244" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">a&#8242;</text><circle cx="324" cy="240" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="324" y="244" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">d&#8242;</text><line x1="245" y1="240" x2="311" y2="240" stroke="#5a5a5a" stroke-width="1.1"/><text x="278.0" y="254.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#8a8a8a" font-weight="400" text-anchor="middle">0.50</text><text x="278" y="292" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#8a8a8a" font-weight="400" text-anchor="middle">representatives</text><line x1="348" y1="240" x2="394" y2="240" stroke="#5a5a5a" stroke-width="1.2" marker-end="url(#ah)"/><text x="371" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9" fill="#1a1a1a" font-weight="600" text-anchor="middle">&#964;*&#8322; = 0.6998</text><circle cx="430" cy="226" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="430" y="230" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">a&#8242;</text><circle cx="430" cy="258" r="13" fill="#ffffff" stroke="#1f497d" stroke-width="1.3"/><text x="430" y="262" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="10.5" fill="#1a1a1a" font-weight="600" text-anchor="middle">d&#8242;</text><text x="430" y="292" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#1d6f5c" font-weight="600" text-anchor="middle">separated</text><text x="492" y="228" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5a5a5a" font-weight="400" text-anchor="start">Each step re-derives its own crossing</text><text x="492" y="242" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5a5a5a" font-weight="400" text-anchor="start">boundary on the contracted graph, so the</text><text x="492" y="256" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#5a5a5a" font-weight="400" text-anchor="start">weak 0.50 link never survives.</text><text x="492" y="274" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="9.5" fill="#1d6f5c" font-weight="600" text-anchor="start">The threshold is measured, not chosen.</text></svg>
