name: Aggregate human L3 review votes

on:
  schedule:
    # 01:23 Asia/Seoul, expressed in UTC for GitHub Actions cron.
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: aggregate-human-l3-review-votes
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Export review issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues?state=all&per_page=100" \
            > "${RUNNER_TEMP}/review_issues.json"

      - name: Validate votes and compute daily statistics
        run: |
          python3 scripts/aggregate_human_review_votes.py \
            --issues-json "${RUNNER_TEMP}/review_issues.json" \
            --cards-json public/data/releases/RAI-Risk-Taxonomy-2.0-master/cards.json \
            --output-dir review_logs

      - name: Commit changed log exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add review_logs
          if git diff --cached --quiet; then
            echo "No review-log changes"
          else
            git commit -m "chore: update daily human L3 review statistics"
            git push
          fi
